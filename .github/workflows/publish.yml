name: Publish

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: Publish NPM
    needs: ci
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing requires npm >= 11.5.1, but Node 22 ships npm 10.
      - name: Update npm (trusted publishing support)
        run: npm install -g npm@11.15.0
      - name: Install
        run: yarn install --immutable
      - name: Build
        run: yarn build
      # Authenticated via OIDC
      - name: Publish to NPM
        run: npm publish --access public
